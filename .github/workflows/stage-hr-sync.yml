name: Stage HR sync heal

# Vercel crons only fire on PRODUCTION deployments, but our stage app lives on
# preview builds (git-stage alias) — so the vercel.json cron entry only covers
# the production app (inventory.summit-one.app). This scheduled action is what
# triggers the daily HR mirror sync + healing (stale positions/people
# deactivated so position-title buying gates can't silently break) on STAGE.
# Secret: STAGE_CRON_SECRET = the stage deployment's CRON_SECRET.
# NOTE: scheduled workflows run from the repo's DEFAULT branch — keep this file
# present there (a copy is maintained on dev) as well as on stage.

on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stage hr-sync cron route
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.STAGE_CRON_SECRET }}" \
            "https://summit-one-inventory-management-git-stage-tylion05s-projects.vercel.app/api/system/cron/hr-sync")
          cat /tmp/out.json
          echo
          [ "$code" = "200" ]
