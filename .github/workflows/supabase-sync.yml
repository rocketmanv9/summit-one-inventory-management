name: Supabase Database Sync
on:
  push:
    branches:
      - dev
      - stage
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-sync.yml'

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "project_id=${{ secrets.PROD_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "db_password=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/stage" ]; then
            echo "env=stage" >> $GITHUB_OUTPUT
            echo "project_id=${{ secrets.STAGE_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "db_password=${{ secrets.STAGE_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "project_id=${{ secrets.DEV_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "db_password=${{ secrets.DEV_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          fi

      - name: Link Supabase project
        run: |
          supabase link --project-ref ${{ steps.env.outputs.project_id }} --password ${{ steps.env.outputs.db_password }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to ${{ steps.env.outputs.env }}
        run: |
          supabase db push --password ${{ steps.env.outputs.db_password }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Migration complete
        run: |
          echo "✅ Database migrations pushed to ${{ steps.env.outputs.env }} environment"
          echo "Project: ${{ steps.env.outputs.project_id }}"
